name: Java CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'integration/**'
  pull_request:
    branches:
      - main
      - integration
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_OPTS: --enable-preview

jobs:
  branch-rules:
    name: Branch and commit rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify contribution rules exist
        run: |
          test -f CONTRIBUTING.md
          test -f .githooks/commit-msg
          grep -q "Signed-off-by" .githooks/commit-msg
          echo "Branch/commit policy files are present."

  build-and-test:
    name: Build, quality gates and tests
    runs-on: ubuntu-latest
    needs: branch-rules

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Compile application (preview APIs enabled)
        run: ./mvnw -B -DskipTests compile

      - name: Check Redis connection
        run: docker run --rm --network host redis:7-alpine redis-cli -h localhost -p 6379 ping

      - name: Run all tests (includes pinning + leak gates)
        env:
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: '6379'
          ORCHESTRATOR_REGISTRY_MODE: redis
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

# Member 4 - Week 4 full cluster (3 orchestrator nodes + Redis)
services:
  redis:
    image: redis:7-alpine
    container_name: orchestrator-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  orchestrator-1:
    build: .
    container_name: orchestrator-node-1
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ORCHESTRATOR_NODE_ID: node-1
      ORCHESTRATOR_GRPC_PORT: "9090"
      ORCHESTRATOR_EXECUTOR_MODE: virtual
    ports:
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10

  orchestrator-2:
    build: .
    container_name: orchestrator-node-2
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ORCHESTRATOR_NODE_ID: node-2
      ORCHESTRATOR_GRPC_PORT: "9090"
      ORCHESTRATOR_EXECUTOR_MODE: virtual
    ports:
      - "8081:8080"
      - "9091:9090"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10

  orchestrator-3:
    build: .
    container_name: orchestrator-node-3
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ORCHESTRATOR_NODE_ID: node-3
      ORCHESTRATOR_GRPC_PORT: "9090"
      ORCHESTRATOR_EXECUTOR_MODE: virtual
    ports:
      - "8082:8080"
      - "9092:9090"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis-data:

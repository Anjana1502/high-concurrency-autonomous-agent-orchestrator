# Local development profile - no Redis required (Member 4)
spring.data.redis.host=localhost
spring.data.redis.port=6379
orchestrator.registry.mode=memory
orchestrator.node-id=node-dev
orchestrator.executor.mode=virtual
orchestrator.simulator.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.health.redis.enabled=false

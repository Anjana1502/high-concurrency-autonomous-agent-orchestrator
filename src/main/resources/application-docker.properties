# Docker / cluster profile (Member 4)
spring.data.redis.host=redis
spring.data.redis.port=6379
orchestrator.registry.mode=redis
orchestrator.node-id=${ORCHESTRATOR_NODE_ID:node-1}
orchestrator.grpc.port=${ORCHESTRATOR_GRPC_PORT:9090}
orchestrator.grpc.enabled=true
orchestrator.executor.mode=${ORCHESTRATOR_EXECUTOR_MODE:virtual}
orchestrator.registry.stale-after-seconds=15
orchestrator.registry.node-heartbeat-ms=5000
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.redis.enabled=true
